<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MUYAH-CODE Live</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 6'%3E%3Cpath fill='%235eead4' d='M0 0h2v1h1v1h1v1h2V2h1V1h1V0h2v6H8V4H7v1H3V4H2v2H0z'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #071012; --bg2: #0b181b; --panel: #0d1d20; --panel2: #10252a; --line: rgba(94, 234, 212, .16);
  --line2: rgba(94, 234, 212, .08);
  --text: #d8f3ee; --dim: #7fa6a0; --faint: #4b6b67;
  --teal: #5eead4; --cyan: #67e8f9; --amber: #fbbf24; --rose: #fb7185;
  --green: #86efac; --violet: #c4b5fd; --pink: #f0abfc; --orange: #fdba74; --blue: #93c5fd;
  --mono: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.45 var(--sans); }
body { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); height: 100vh; overflow: hidden; }
button, select { font: 12px var(--mono); color: var(--text); background: var(--bg2); border: 1px solid var(--line); border-radius: 6px;
  padding: 4px 10px; cursor: pointer; }
button:hover { border-color: var(--teal); }
header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; min-width: 0; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: .08em; }
.brand svg { width: 30px; height: 18px; }
.brand small { font-weight: 400; color: var(--dim); letter-spacing: 0; }
.badge { font: 11px var(--mono); padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim);
  white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.badge.live { color: var(--bg); background: var(--teal); border-color: var(--teal); }
.badge.live::before { content: "● "; animation: blink 1.4s infinite; }
.badge.off { color: var(--rose); border-color: rgba(251,113,133,.4); }
@keyframes blink { 50% { opacity: .3; } }
.meta { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; min-width: 0; }
.controls { display: none; align-items: center; gap: 8px; width: 100%; }
.controls.on { display: flex; }
.controls input[type=range] { flex: 1; accent-color: var(--teal); min-width: 60px; }
.controls .clock { font: 12px var(--mono); color: var(--dim); min-width: 96px; text-align: right; }

/* ---------------------------------------------------------------- stage: an infinite canvas of panels */
main { position: relative; min-height: 0; min-width: 0; }
#viewport { position: absolute; inset: 0; overflow: hidden; cursor: grab; touch-action: none;
  background: var(--bg); }
#viewport.panning { cursor: grabbing; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#wires { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.wire { fill: none; stroke: rgba(94,234,212,.16); stroke-width: 1.5; transition: stroke calc(.3s * var(--k, 1)); }
.wire.active { stroke: var(--c); stroke-width: 2; }
.wire.hot { stroke: var(--c); stroke-width: 2.2; stroke-dasharray: 7 7; animation: flow calc(.55s * var(--k, 1)) linear infinite; }
@keyframes flow { to { stroke-dashoffset: -14; } }
.toolbar { position: absolute; top: 10px; right: 12px; display: flex; gap: 6px; z-index: 5; }
.toolbar button.on { color: var(--bg); background: var(--teal); border-color: var(--teal); }
.caption { position: absolute; left: 12px; bottom: 10px; max-width: calc(100% - 24px); font: 12px var(--mono); color: var(--dim);
  background: var(--bg2); border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; z-index: 5;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }

.pnl { position: absolute; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column;
  transition: left calc(.45s * var(--k, 1)) ease, top calc(.45s * var(--k, 1)) ease, opacity calc(.35s * var(--k, 1)) ease,
    border-color calc(.3s * var(--k, 1)); overflow: hidden; cursor: pointer; }
.pnl.new { opacity: 0; }
.pnl.dragging { transition: none; z-index: 3; border-color: var(--teal); }
.pnl.collapsed .pb { display: none; }
.pnl.collapsed .ph { border-bottom: 0; }
.ph { cursor: grab; user-select: none; }
.pnl.dragging .ph { cursor: grabbing; }
.ph .tog { flex: none; width: 20px; height: 20px; padding: 0; border-radius: 5px; font: 11px var(--mono); line-height: 18px;
  color: var(--dim); background: transparent; border: 1px solid transparent; cursor: pointer; }
.ph .tog:hover { border-color: var(--line); color: var(--text); }
.flychip { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 5px; padding: 2px 8px 2px 6px;
  font: 600 11.5px var(--mono); color: var(--text); background: var(--bg2); border: 1px solid var(--c, var(--teal)); border-radius: 999px;
  white-space: nowrap; pointer-events: none; z-index: 4; will-change: transform; }
.flychip svg { width: 11px; height: 13px; flex: none; }
.pnl.s-run, .pnl.s-stream { border-color: rgba(94,234,212,.5); }
.pnl.s-ask { border-color: var(--amber); }
.pnl.s-fail { border-color: rgba(251,113,133,.6); }
.ph { display: flex; align-items: center; gap: 7px; padding: 7px 10px; border-bottom: 1px solid var(--line2); background: var(--panel2); flex: none; min-width: 0; }
.ph .pt { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 1 auto; }
.ph .ps { font: 11px var(--mono); color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1 1 auto; }
.ph .pm { font: 11px var(--mono); color: var(--dim); flex: none; }
.pb { flex: 1; min-height: 0; overflow: auto; padding: 8px 10px; scrollbar-width: thin; scrollbar-color: #1f3b3d transparent; font-size: 12px; cursor: auto; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; background: var(--faint); }
.d-idle { background: var(--faint); } .d-wait { background: transparent; border: 1.5px solid var(--dim); }
.d-ask { background: var(--amber); } .d-run { background: var(--teal); animation: blink 1s infinite; }
.d-stream { background: var(--cyan); animation: blink 1s infinite; } .d-ok { background: var(--green); } .d-fail { background: var(--rose); }
.d-sent { background: transparent; border: 1.5px solid var(--cyan); }
.c-ask { color: var(--amber); } .c-run { color: var(--teal); } .c-ok { color: var(--green); } .c-fail { color: var(--rose); }
.c-dim { color: var(--dim); } .c-faint { color: var(--faint); } .c-cyan { color: var(--cyan); } .c-violet { color: var(--violet); } .c-pink { color: var(--pink); }
.empty { color: var(--faint); font-size: 12px; }
pre, .mono { font: 11.5px/1.45 var(--mono); }
pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; color: #b9d8d2; }
.diff .add { color: var(--green); background: rgba(134,239,172,.07); display: block; }
.diff .del { color: var(--rose); background: rgba(251,113,133,.07); display: block; }
.diff .hunk { color: var(--cyan); display: block; }
.diff .ctx { display: block; }
.row { display: flex; align-items: baseline; gap: 7px; min-width: 0; padding: 2px 0; }
.row .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .dot { align-self: center; }
.item { border-radius: 6px; padding: 3px 5px; margin: 0 -5px; }
.item:hover { background: rgba(94,234,212,.06); }
.tag { font: 10px var(--mono); color: var(--violet); border: 1px solid rgba(196,181,253,.35); border-radius: 4px; padding: 0 4px; flex: none; }
.sub { color: var(--dim); font-size: 11px; }
.sec { font: 600 10.5px var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); margin: 8px 0 4px; }
.sec:first-child { margin-top: 0; }
.think { color: var(--faint); font-style: italic; white-space: pre-wrap; overflow-wrap: anywhere; }
.answer { white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.5 var(--mono); }
.cursor { display: inline-block; width: 7px; height: 12px; background: var(--cyan); vertical-align: -2px; animation: blink 1s infinite; }
.cmd { border-bottom: 1px solid var(--line2); padding: 5px 0; }
.cmd:last-child { border-bottom: 0; }
.cmd pre { max-height: 132px; overflow: hidden; color: #9fc3bd; margin-top: 3px; }
.bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: rgba(94,234,212,.07); }
.bar i { display: block; height: 100%; }
.stack { display: flex; height: 12px; border-radius: 4px; overflow: hidden; background: rgba(94,234,212,.07); margin: 4px 0 6px; }
.stack i { display: block; height: 100%; }
.legend { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; font: 11.5px var(--mono); }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }
.tstat { display: grid; grid-template-columns: minmax(0, 104px) minmax(0, 1fr) auto; gap: 7px; align-items: center; font: 11.5px var(--mono); padding: 1px 0; }
.tstat .tn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tstat .tv { color: var(--dim); font-size: 11px; white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font: 11px var(--mono); padding: 0 7px; border-radius: 999px; border: 1px solid rgba(94,234,212,.12); color: var(--faint);
  max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip.used { color: var(--text); border-color: currentColor; }
.todo-done { color: var(--faint); text-decoration: line-through; }
.todo-active { color: var(--amber); }
.log div { display: flex; gap: 8px; white-space: nowrap; font: 11.5px/1.5 var(--mono); }
.log time { color: var(--faint); flex: none; width: 40px; text-align: right; }
.log span { overflow: hidden; text-overflow: ellipsis; }
.k-turn { color: var(--teal); } .k-llm { color: var(--cyan); } .k-tool { color: var(--amber); } .k-mcp { color: var(--pink); }
.k-hook { color: var(--orange); } .k-ask { color: var(--amber); } .k-err { color: var(--rose); } .k-ok { color: var(--green); }
.k-sub { color: var(--violet); } .k-dim { color: var(--dim); }

/* ---------------------------------------------------------------- detail drawer */
#drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(580px, 100vw); background: var(--bg2); border-left: 1px solid var(--line);
  transform: translateX(100%); transition: transform .25s ease; z-index: 20; display: flex; flex-direction: column; }
#drawer.open { transform: none; }
#drawer .dh { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
#drawer .dh b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
#dbody { flex: 1; overflow: auto; padding: 12px 14px 24px; scrollbar-width: thin; scrollbar-color: #1f3b3d transparent; }
#dbody pre { background: var(--bg); border: 1px solid var(--line2); border-radius: 6px; padding: 8px 10px; margin: 4px 0 10px; }
#dbody .kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font: 12px var(--mono); margin-bottom: 10px; }
#dbody .kv span:nth-child(odd) { color: var(--dim); }
#dbody .blk { border: 1px solid var(--line2); border-radius: 8px; padding: 8px 10px; margin-bottom: 10px; }

/* ---------------------------------------------------------------- timeline strip */
footer { border-top: 1px solid var(--line); padding: 0 16px; min-width: 0; }
.fbar { display: flex; align-items: center; gap: 10px; height: 34px; cursor: pointer; min-width: 0; user-select: none; }
.fbar:focus-visible { outline: 1px solid var(--teal); outline-offset: -1px; }
.fbar .chev { color: var(--faint); font-size: 11px; width: 10px; flex: none; }
.fbar .fl { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); flex: none; }
#mini { flex: 1 1 120px; min-width: 60px; height: 14px; border-radius: 3px; display: block; }
.keys { display: flex; gap: 12px; font: 11.5px var(--mono); color: var(--dim); flex: 0 1 auto; min-width: 0; overflow: hidden; white-space: nowrap; }
.keys b { color: var(--text); font-weight: 600; }
.fbody { padding: 0 0 10px; }
.fbody .lg { margin-bottom: 4px; }
.charts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 8px; }
.charts.big, .pnl .charts { grid-template-columns: minmax(0, 1fr); }
.pnl .charts { margin-top: 0; gap: 8px; }
.chart { border: 1px solid var(--line2); border-radius: 8px; padding: 6px 8px; background: var(--panel); min-width: 0; }
.chart .ch { display: flex; justify-content: space-between; gap: 8px; font-size: 11.5px; color: var(--dim); margin-bottom: 3px; }
.chart .ch b { color: var(--text); font-weight: 600; }
.chart .ch span { font: 11.5px var(--mono); color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chart canvas { display: block; width: 100%; }
.chart .ch .bignum { font: 600 17px var(--mono); color: var(--cyan); line-height: 1; }
.chart .cf { display: flex; justify-content: space-between; gap: 8px; font: 10.5px var(--mono); color: var(--faint); margin-top: 3px; flex-wrap: wrap; }
.chart .cf i { display: inline-block; width: 7px; height: 7px; border-radius: 2px; margin: 0 3px 0 5px; }
.gauge { margin: 4px 0 6px; }
.gauge .gl { display: flex; justify-content: space-between; gap: 8px; font: 11px var(--mono); color: var(--dim); margin-bottom: 2px; }
.gauge .gl span:last-child { color: var(--text); white-space: nowrap; }
.lg { display: flex; flex-wrap: wrap; gap: 2px 10px; font: 10px var(--mono); letter-spacing: 0; text-transform: none; color: var(--faint); }
.lg i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; }
.lg .hatch { background: repeating-linear-gradient(135deg, var(--amber) 0 2px, transparent 2px 4px); }
#timeline { width: 100%; height: 108px; display: block; }
.badge.rec { color: var(--rose); border-color: rgba(251,113,133,.4); }
.badge.rec::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--rose); margin-right: 5px; }
a.btn { font: 11px var(--mono); color: var(--text); background: var(--bg2); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px;
  text-decoration: none; white-space: nowrap; }
a.btn:hover { border-color: var(--teal); }
#dcopy.done, .cpy.done { color: var(--green); border-color: var(--green); }
#dbody pre { position: relative; }
.cpy { position: absolute; top: 4px; right: 4px; padding: 0 6px; font: 12px var(--mono); line-height: 18px; color: var(--dim); background: var(--bg2);
  border: 1px solid var(--line); border-radius: 5px; opacity: .75; }
.cpy:hover { opacity: 1; color: var(--text); }

/* ---------------------------------------------------------------- phones and narrow windows: one scrolling column */
@media (max-width: 900px) {
  body { height: auto; min-height: 100vh; overflow: auto; overflow-x: hidden; }
  main { position: static; }
  #viewport { position: static; overflow: visible; cursor: auto; touch-action: auto; }
  #world { position: static; transform: none !important; display: flex; flex-direction: column; gap: 12px; padding: 12px 14px 60px; }
  #wires, .toolbar, .flychip { display: none; }
  .ph { cursor: auto; }
  .pnl { position: static; width: auto !important; height: auto !important; }
  .pnl .pb { max-height: 300px; }
  .caption { position: fixed; left: 10px; right: 10px; bottom: 10px; max-width: none; }
  .charts { grid-template-columns: minmax(0, 1fr); }
  .keys span:nth-child(n+3) { display: none; }
  header, footer { padding-left: 14px; padding-right: 14px; }
  .meta { margin-left: 0; }
}
#drawer .filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
#drawer .filters button { background: transparent; color: inherit; border: 1px solid rgba(127,166,160,.35); border-radius: 6px;
  padding: 2px 8px; font: 12px ui-monospace, Consolas, monospace; cursor: pointer; }
#drawer .filters button.on { border-color: currentColor; font-weight: 600; }
#drawer details summary { cursor: pointer; list-style: none; }
#drawer details summary::-webkit-details-marker { display: none; }
#drawer details[open] summary { font-weight: 600; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg viewBox="0 0 10 6" aria-hidden="true"><path fill="#5eead4" d="M0 0h2v1h1v1h1v1h2V2h1V1h1V0h2v6H8V4H7v1H3V4H2v2H0z"/></svg>
    MUYAH-CODE <small>inside the agent</small>
  </div>
  <span id="status" class="badge">connecting…</span>
  <span id="rec" class="badge rec" hidden>REC</span>
  <a id="download" class="btn" download hidden title="Download this session's recorded events (JSONL)">Download</a>
  <div class="meta">
    <span class="badge" id="m-model">model –</span>
    <span class="badge" id="m-provider">provider –</span>
    <span class="badge" id="m-mode">mode –</span>
    <span class="badge" id="m-window">window –</span>
  </div>
  <div class="controls" id="controls">
    <button id="play" title="Play / pause (space)">❚❚</button>
    <button id="restart" title="Restart">↺</button>
    <select id="speed" title="Playback speed">
      <option value="0.1">0.1×</option><option value="0.25">0.25×</option><option value="0.5">0.5×</option>
      <option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option>
      <option value="8">8×</option><option value="16">16×</option>
    </select>
    <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Position">
    <span class="clock" id="clock">0:00 / 0:00</span>
  </div>
</header>

<main>
  <div id="viewport">
    <div id="world"><svg id="wires" width="10" height="10"></svg></div>
  </div>
  <div class="toolbar">
    <button id="fit" title="Fit everything (F)">Fit all</button>
    <button id="reset" title="Forget panels you moved or collapsed; back to the automatic layout">Reset layout</button>
    <button id="follow" class="on" title="Keep what is active in view">Follow</button>
    <button id="zoom" title="Zoom 100% (0)">100%</button>
  </div>
  <div class="caption" id="caption">Waiting for the agent…</div>
</main>

<footer id="foot">
  <div class="fbar" id="fbar" role="button" tabindex="0" aria-expanded="false" title="Show the timeline and usage charts">
    <span class="chev" id="fchev">▸</span><span class="fl">Timeline</span>
    <canvas id="mini"></canvas>
    <span class="keys" id="fkeys"></span>
  </div>
  <div class="fbody" id="fbody" hidden>
    <div class="lg">
      <span><i style="background:#67e8f9;opacity:.3"></i>model waiting</span>
      <span><i style="background:#67e8f9"></i>model streaming</span>
      <span><i style="background:#5eead4"></i>files</span>
      <span><i style="background:#fbbf24"></i>commands</span>
      <span><i style="background:#93c5fd"></i>web</span>
      <span><i style="background:#f0abfc"></i>MCP</span>
      <span><i style="background:#c4b5fd"></i>skills · agents</span>
      <span><i class="hatch"></i>awaiting approval</span>
      <span><i style="background:#fb7185"></i>failed</span>
    </div>
    <canvas id="timeline"></canvas>
    <div id="charts"></div>
  </div>
</footer>

<aside id="drawer" aria-hidden="true">
  <div class="dh"><b id="dtitle">Details</b><button id="dcopy" title="Copy everything in this drawer as text">Copy</button><button id="dclose" title="Close (Esc)">✕</button></div>
  <div id="dbody"></div>
</aside>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const C = {
  teal: "#5eead4", cyan: "#67e8f9", amber: "#fbbf24", rose: "#fb7185", green: "#86efac", violet: "#c4b5fd",
  text: "#d8f3ee", dim: "#7fa6a0", faint: "#4b6b67", pink: "#f0abfc", orange: "#fdba74", blue: "#93c5fd", other: "#a7c4bf",
};
const MONO = 'ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace';
const PART_COLORS = { system: C.violet, conversation: C.teal, tools: C.amber };
const KIND_COLOR = { file: C.teal, search: C.teal, cmd: C.amber, web: C.blue, mcp: C.pink, skill: C.violet,
  agent: C.violet, todo: C.other, other: C.other };
const MAX_GAP = 2.5;   // replay: idle gaps longer than this (seconds) are shortened
const fmtNum = (n) => n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e4 ? Math.round(n / 1e3) + "k"
  : n >= 1e3 ? (n / 1e3).toFixed(1) + "k" : String(n);
const fmtTime = (s) => { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
const fmtDur = (s) => s >= 60 ? fmtTime(s) : (s || 0).toFixed(s < 10 ? 1 : 0) + "s";
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const oneLine = (s) => String(s || "").replace(/\s+/g, " ").trim();
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const since = (t) => fmtDur(Math.max(0, clock() - t));
const tail = (s, n) => { s = String(s || ""); return s.length > n ? "…" + s.slice(-n) : s; };
const head = (s, n) => { s = String(s || ""); return s.length > n ? s.slice(0, n) + "…" : s; };

// ------------------------------------------------------------------ what a tool is (from its real name/args)

function mcpParts(name) {   // MCP tools are named mcp__<server>__<tool>
  if (!name || !name.startsWith("mcp__")) return null;
  const rest = name.slice(5), i = rest.indexOf("__");
  return i < 0 ? { server: rest, tool: "" } : { server: rest.slice(0, i), tool: rest.slice(i + 2) };
}
function toolKind(name) {
  if (!name) return "other";
  if (name.startsWith("mcp__")) return "mcp";
  if (["Read", "Write", "Edit", "MultiEdit", "NotebookEdit"].includes(name)) return "file";
  if (["Grep", "Glob", "LS"].includes(name)) return "search";
  if (["Bash", "BashOutput", "KillShell"].includes(name)) return "cmd";
  if (["WebFetch", "WebSearch"].includes(name)) return "web";
  if (name === "Skill") return "skill";
  if (name === "Agent" || name === "Task") return "agent";
  if (name === "TodoWrite") return "todo";
  return "other";
}
function baseName(p) { const parts = String(p || "").split(/[\\/]/).filter(Boolean); return parts.length ? parts[parts.length - 1] : ""; }
function shortUrl(u) { const m = /^[a-z]+:\/\/([^/?#]+)([^?#]*)/i.exec(String(u || "")); return m ? m[1] + (m[2] && m[2] !== "/" ? m[2] : "") : String(u || ""); }
function normPath(p) {
  let s = String(p || "").replace(/\\/g, "/");
  const cwd = String(S.cwd || "").replace(/\\/g, "/").replace(/\/$/, "");
  if (cwd && s.toLowerCase().startsWith(cwd.toLowerCase() + "/")) s = s.slice(cwd.length + 1);
  return s.replace(/^\.\//, "");
}
function cmdLabel(t) {
  const a = t.args || {};
  if (t.name === "Bash") return "$ " + oneLine(a.command || t.title);
  if (t.name === "BashOutput") return "output of job " + (a.job_id ?? "");
  if (t.name === "KillShell") return "kill job " + (a.job_id ?? "");
  return t.title || t.name;
}
function toolLabel(t) {
  const a = t.args || {};
  switch (t.kind) {
    case "file": return baseName(a.file_path || a.path || a.notebook_path) || t.title || t.name;
    case "cmd": return cmdLabel(t);
    case "web": return t.name === "WebSearch" ? oneLine(a.query || t.title) : shortUrl(a.url || t.title);
    case "mcp": return t.mcp.server + " · " + (t.mcp.tool || "?");
    case "skill": return a.skill || t.title || "skill";
    case "agent": return (a.subagent_type || "agent") + (a.description ? " · " + oneLine(a.description) : "");
    case "search": return oneLine(a.pattern || a.path || t.title || t.name);
    default: return oneLine(t.title || t.name);
  }
}
function toolVerb(t) { return t.kind === "mcp" ? "MCP" : t.kind === "agent" ? "sub-agent" : t.name; }
function statKey(t) { return t.kind === "mcp" ? t.mcp.server + " · " + t.mcp.tool : t.name; }
function toolPanel(t) {   // which panel on the canvas shows this tool call
  const a = t.args || {};
  if (t.kind === "file" && (a.file_path || a.path || a.notebook_path)) return "file:" + normPath(a.file_path || a.path || a.notebook_path);
  if (t.kind === "cmd") return "terminal";
  if (t.kind === "mcp") return "mcp:" + t.mcp.server;
  if (t.kind === "skill") return "skills";
  if (t.kind === "agent") return "model";   // the sub-agent gets its own panel when it really starts
  return "tools";
}

// ------------------------------------------------------------------ state (pure: rebuilt on seek)

function freshState() {
  return {
    model: "", provider: "", mode: "", window: 0, cwd: "", sessionSeen: false, lessonsPath: "", memoryFiles: [],
    inv: { tools: [], skills: [], agents: [], mcp: [], hooks: [] },
    ctx: { used: 0, usable: 0, window: 0, parts: {} }, ctxUsed: {}, compactions: [],
    turns: 0, calls: 0, toolCalls: 0, toolErrors: 0, tokIn: 0, tokOut: 0,
    turn: null, prompts: [], userMsgs: [], queue: [],
    llm: new Map(), lastCall: new Map(), llmFailed: null,
    tools: new Map(), all: [], toolStats: new Map(), commands: [], other: [],
    files: new Map(), mcpCalls: new Map(), skill: null, skillRuns: [], skillText: {},
    subRuns: new Map(), subCur: {}, subCount: {},
    subagents: new Map(),   // for the timeline: agent -> {start, active}
    skillUse: new Map(), agentUse: new Map(), hookLog: [], hookRuns: 0, lessonsSeen: false,
    tokEv: [], reqs: [], ctxSeries: [], limits: null,
    cost: { total: 0, priced: 0, unpriced: 0, tin: 0, cached: 0, budget: [], by: {} },
    todos: [], lessons: [], log: [], spans: [], caption: "Waiting for the agent…", now: 0, ver: 0,
  };
}
let S = freshState();

function log(ev, kind, text) {
  S.log.push({ t: ev.t || 0, kind, text, ev });
  if (S.log.length > 600) S.log.splice(0, S.log.length - 600);
}
function pushSpan(sp) { S.spans.push(sp); if (S.spans.length > 3000) S.spans.splice(0, S.spans.length - 3000); }
function subRun(agent) { return S.subRuns.get(S.subCur[agent]) || null; }

function newTool(ev, key) {
  const t = { key, agent: ev.agent || "main", id: ev.id, name: ev.name || "?", title: ev.title || ev.name || "",
    args: ev.args || {}, kind: toolKind(ev.name), mcp: mcpParts(ev.name), state: "requested", reqAt: ev.t || 0,
    askAt: null, askEnd: null, startAt: null, endAt: null, ok: null, ran: false, file: null, output: "", diff: "", summary: "" };
  t.panel = toolPanel(t);
  S.all.push(t); if (S.all.length > 2000) S.all.splice(0, S.all.length - 2000);
  if (t.kind === "cmd") { S.commands.push(t); if (S.commands.length > 300) S.commands.splice(0, S.commands.length - 300); }
  else if (t.panel === "tools") { S.other.push(t); if (S.other.length > 300) S.other.splice(0, S.other.length - 300); }
  if (t.panel.startsWith("file:")) {
    const path = t.panel.slice(5);
    const f = S.files.get(path) || { path, full: (t.args || {}).file_path || path, ops: [], first: ev.t || 0 };
    f.ops.push(t); S.files.set(path, f);
  }
  if (t.kind === "mcp") { const l = S.mcpCalls.get(t.mcp.server) || []; l.push(t); S.mcpCalls.set(t.mcp.server, l); }
  const run = t.agent !== "main" ? subRun(t.agent) : null;
  if (run) run.steps.push({ kind: "tool", t });
  return t;
}

function endLlm(agent, t, error) {
  const c = S.llm.get(agent);
  if (!c) return;
  c.end = t; c.error = error || "";
  pushSpan({ lane: 0, agent, start: c.start, sent: c.sentAt, first: c.firstAt, end: t, ok: !error });
  S.lastCall.set(agent, c);
  S.llm.delete(agent);
}

function closeTool(key, t, why) {   // still in flight when its turn ended (interrupted)
  const x = S.tools.get(key);
  if (!x) return;
  Object.assign(x, { state: "done", ok: false, endAt: t, summary: why });
  if (x.ran) pushSpan({ lane: 1, agent: x.agent, kind: x.kind, label: toolLabel(x), ask: x.askAt, askEnd: x.askEnd, start: x.startAt, end: t, ok: false });
  S.tools.delete(key);
}

function apply(ev, fx) {
  S.now = Math.max(S.now, ev.t || 0);
  S.ver++;
  const agent = ev.agent || "main", sub = agent !== "main", who = sub ? `[${agent}] ` : "";
  const key = agent + ":" + ev.id;
  switch (ev.type) {
    case "session":
      Object.assign(S, { model: ev.model || "", provider: ev.provider || "", mode: ev.mode || "", window: ev.window || 0, cwd: ev.cwd || "" });
      S.inv = { tools: ev.tools || [], skills: ev.skills || [], agents: ev.agents || [], mcp: ev.mcp || [], hooks: ev.hooks || [] };
      if (ev.lessons_path) S.lessonsPath = ev.lessons_path;
      if (ev.memory_files) S.memoryFiles = ev.memory_files;
      S.sessionSeen = true;
      if (S.turns === 0) S.caption = "Ready. Send a prompt in the terminal.";
      log(ev, "k-dim", `session · ${ev.model || "?"} · ${fmtNum(ev.window || 0)} window · mode ${ev.mode || "?"}`);
      break;
    case "turn_start":
      S.turns++; S.lessons = []; S.llmFailed = null; S.userMsgs = []; S.skill = null;
      S.turn = { start: ev.t || 0, prompt: String(ev.prompt || "") };
      S.prompts.push({ t: ev.t || 0, text: String(ev.prompt || "") });
      S.caption = "You: " + oneLine(ev.prompt);
      log(ev, "k-turn", "❯ " + oneLine(ev.prompt));
      fx && fx.hot("you>context", C.text);
      break;
    case "user_message":
      S.userMsgs.push({ t: ev.t || 0, text: String(ev.text || ""), queued: !!ev.queued });
      { const i = S.queue.findIndex((q) => q === ev.text); if (i >= 0) S.queue.splice(i, 1); }
      log(ev, "k-turn", (ev.queued ? "↳ queued message delivered: " : "❯ ") + oneLine(ev.text));
      S.caption = "Your queued message reached the model's context";
      fx && fx.hot("you>context", C.text);
      break;
    case "queue":
      S.queue = (ev.items || []).map((x) => typeof x === "string" ? x : String(x.text ?? x.content ?? JSON.stringify(x)));
      break;
    case "turn_end":
      endLlm("main", ev.t, false);
      [...S.tools.keys()].forEach((k) => closeTool(k, ev.t, "stopped: turn " + ev.status));
      S.subRuns.forEach((r) => { if (r.active) { r.active = false; r.status = r.status || ev.status; r.end = ev.t; } });
      S.subagents.forEach((s) => { if (s.active) { s.active = false; s.end = ev.t; } });
      S.turn = null;
      S.caption = `Turn ${ev.status} in ${fmtDur(ev.duration || 0)} · ${ev.tool_calls || 0} tool calls`;
      log(ev, ev.status === "ok" ? "k-ok" : "k-err", `turn ${ev.status} · ${fmtDur(ev.duration || 0)} · ${ev.tool_calls || 0} tool calls`);
      break;
    case "llm_start": {
      endLlm(agent, ev.t, false);
      const c = { agent, start: ev.t || 0, state: "preparing", sentAt: null, firstAt: null, chars: 0, model: ev.model || "",
        text: "", thinking: "", calls: [], tokIn: 0, tokOut: 0, end: null, error: "" };
      S.llm.set(agent, c);
      if (S.llmFailed && S.llmFailed.agent === agent) S.llmFailed = null;
      S.calls++;
      const run = sub ? subRun(agent) : null;
      if (run) run.steps.push({ kind: "llm", c });
      S.caption = who + "Preparing a request for the model…";
      break;
    }
    case "llm_status": {
      const c = S.llm.get(agent);
      if (!c) break;
      if (ev.state === "sent") {
        c.state = "sent"; c.sentAt = ev.t;
        S.caption = who + `Request sent (~${fmtNum(S.ctxUsed[agent] || 0)} tokens) · waiting for the model…`;
        if (fx) {
          const from = sub ? `sub:${S.subCur[agent]}` : "context", tok = S.ctxUsed[agent] || 0;
          fx.hot(from + ">model", C.cyan);
          fx.chip(from, "model", { label: "request" + (tok ? " · ~" + fmtNum(tok) + " tokens" : ""), color: C.cyan });
        }
      } else if (ev.state === "first_token" && c.state !== "streaming") {
        c.state = "streaming"; c.firstAt = ev.t;
        S.caption = who + "The model is replying…";
      }
      break;
    }
    case "llm_tokens": {
      const c = S.llm.get(agent);
      if (c) {
        c.chars += ev.chars || 0;
        if (c.state !== "streaming") { c.state = "streaming"; c.firstAt = ev.t; }   // older recordings have no llm_status
        c.text = (c.text + (ev.text || "")).slice(-20000);
        c.thinking = (c.thinking + (ev.thinking || "")).slice(-8000);
      }
      if (ev.chars) { S.tokEv.push({ t: ev.t || 0, chars: ev.chars, agent }); if (S.tokEv.length > 6000) S.tokEv.splice(0, 1000); }
      break;
    }
    case "llm_end": {
      S.tokIn += ev.prompt_tokens || 0; S.tokOut += ev.completion_tokens || 0;
      const c = S.llm.get(agent);
      if (c) { c.tokIn = ev.prompt_tokens || 0; c.tokOut = ev.completion_tokens || 0; c.calls = ev.calls || []; }
      if (!ev.error && (ev.prompt_tokens || ev.completion_tokens)) {
        S.reqs.push({ t: ev.t || 0, agent, in: ev.prompt_tokens || 0, out: ev.completion_tokens || 0, dur: ev.duration || 0 });
        if (S.reqs.length > 2000) S.reqs.splice(0, 500);
      }
      endLlm(agent, ev.t, ev.error || "");
      if (ev.error) {
        S.llmFailed = { agent, t: ev.t, error: ev.error };
        log(ev, "k-err", `${who}model request failed · ${ev.error}`);
        S.caption = who + "Model request failed: " + ev.error;
        break;
      }
      log(ev, "k-llm", `${who}model · ${fmtNum(ev.prompt_tokens || 0)} in → ${fmtNum(ev.completion_tokens || 0)} out · `
        + fmtDur(ev.duration || 0) + ((ev.calls || []).length ? " · asks for " + ev.calls.join(", ") : ""));
      S.caption = who + ((ev.calls || []).length ? "The model asked for " + ev.calls.join(", ") : "The model answered");
      break;
    }
    case "tool_request": {
      const t = newTool(ev, key);
      S.tools.set(key, t);
      S.caption = who + "Requested " + toolVerb(t) + ": " + toolLabel(t);
      break;
    }
    case "tool_permission": {
      const t = S.tools.get(key);
      if (!t) break;
      if (ev.state === "asking") {
        t.state = "asking"; t.askAt = ev.t;
        S.caption = who + "Waiting for your approval: " + toolLabel(t);
        log(ev, "k-ask", `${who}approval needed · ${t.title || t.name}${ev.reason ? " · " + ev.reason : ""}`);
      } else if (ev.state === "approved") {
        t.state = "approved"; t.askEnd = ev.t;
        log(ev, "k-ok", `${who}approved${ev.choice ? " (" + ev.choice + ")" : ""} · ${t.title || t.name}`);
      } else if (ev.state === "denied") {
        t.state = "denied"; if (t.askAt != null) t.askEnd = ev.t;
        log(ev, "k-err", `${who}denied · ${t.title || t.name}${ev.reason ? " · " + ev.reason : ""}`);
      }
      break;
    }
    case "tool_start": {
      let t = S.tools.get(key);
      if (!t) { t = newTool(ev, key); S.tools.set(key, t); }
      Object.assign(t, { state: "running", startAt: ev.t || 0, ran: true, title: ev.title || t.title, args: ev.args || t.args });
      if (ev.file) t.file = ev.file;
      if (t.askAt != null && t.askEnd == null) t.askEnd = t.startAt;
      S.toolCalls++;
      if (t.kind === "skill") {
        const n = (t.args || {}).skill || "?";
        S.skillUse.set(n, (S.skillUse.get(n) || 0) + 1); S.skill = { name: n, t: ev.t, tool: t }; S.skillRuns.push(S.skill);
      }
      S.caption = who + "Running " + toolVerb(t) + ": " + toolLabel(t);
      if (fx) {
        const from = sub ? "sub:" + S.subCur[agent] : "model";
        fx.hot(`${from}>${t.panel}`, KIND_COLOR[t.kind]);
        if (t.kind === "file" && t.name !== "Read") fx.chip(from, t.panel, { file: true, label: baseName(t.panel.slice(5)), color: C.teal });
        else if (t.name === "Bash") fx.chip(from, t.panel, { label: "$ " + progName((t.args || {}).command), color: C.amber });
        else if (t.kind === "skill") fx.chip(from, t.panel, { label: (t.args || {}).skill || "skill", color: C.violet });
        else if (t.kind === "mcp") fx.chip(from, t.panel, { label: t.mcp.server + " · " + (t.mcp.tool || "?"), color: C.pink });
      }
      break;
    }
    case "tool_end": {
      let t = S.tools.get(key);
      if (!t) t = newTool(ev, key);
      Object.assign(t, { state: "done", ok: !!ev.ok, endAt: ev.t || 0, summary: ev.summary || "", dur: ev.duration || 0,
        exit: ev.exit_code ?? null, added: ev.added ?? null, removed: ev.removed ?? null, output: ev.output || "", diff: ev.diff || "" });
      S.tools.delete(key);
      if (!ev.ok) S.toolErrors++;
      const sk = statKey(t);
      const st = S.toolStats.get(sk) || { name: sk, kind: t.kind, count: 0, errors: 0, time: 0 };
      st.count++; if (!ev.ok) st.errors++; if (t.ran) st.time += ev.duration || 0;
      S.toolStats.set(sk, st);
      if (t.kind === "skill" && t.ok) S.skillText[(t.args || {}).skill || "?"] = t.output;
      if (t.kind === "agent") {   // the sub-agent's report
        const runs = [...S.subRuns.values()].filter((r) => r.agent === ((t.args || {}).subagent_type || ""));
        if (runs.length) runs[runs.length - 1].report = t.output;
      }
      if (t.ran || t.askAt != null) pushSpan({ lane: 1, agent: t.agent, kind: t.kind, label: toolLabel(t), ask: t.askAt,
        askEnd: t.askEnd ?? (t.askAt != null ? t.endAt : null), start: t.ran ? t.startAt : null, end: t.endAt, ok: t.ok });
      log(ev, !ev.ok ? "k-err" : t.mcp ? "k-mcp" : "k-tool", `${who}${ev.ok ? "●" : "✗"} ${t.title || t.name}`
        + (ev.summary ? " — " + ev.summary : "") + (t.ran ? ` · ${fmtDur(ev.duration || 0)}` : " · never ran"));
      S.caption = who + (ev.ok ? "Done: " : t.ran ? "Failed: " : "Not run: ") + toolLabel(t) + (ev.summary ? " — " + ev.summary : "");
      if (t.ran && fx) {
        const to = sub ? "sub:" + S.subCur[agent] : "context";
        fx.hot(`${t.panel}>${to}`, t.ok ? C.green : C.rose);
        if (t.name === "Read") fx.chip(t.panel, to, { file: true, label: baseName(t.panel.slice(5)), color: t.ok ? C.teal : C.rose });
        else if (t.name === "Bash") fx.chip(t.panel, to, { label: t.exit != null ? "exit " + t.exit : t.ok ? "ok" : "failed", color: t.ok ? C.green : C.rose });
      }
      break;
    }
    case "context":
      S.ctxUsed[agent] = ev.used || 0;
      if (!sub) {
        S.ctx = { used: ev.used || 0, usable: ev.usable || 0, window: ev.window || 0, parts: ev.parts || {} };
        if (ev.usable) { S.ctxSeries.push({ t: ev.t || 0, pct: 100 * (ev.used || 0) / ev.usable }); if (S.ctxSeries.length > 3000) S.ctxSeries.splice(0, 500); }
      }
      break;
    case "cost": {   // every model call, priced (compaction, learning and sub-agents too)
      const k = S.cost;
      k.total = Number(ev.session_cost) || 0; k.unpriced = ev.unpriced || 0;
      if (ev.cost != null) k.priced++;
      k.tin += ev.tokens_in || 0; k.cached += ev.cache_read || 0;
      k.budget = Array.isArray(ev.budget) ? ev.budget : [];
      const p = String(ev.purpose || "main").replace("subagent:", "sub-agent ");
      k.by[p] = (k.by[p] || 0) + (ev.tokens_in || 0) + (ev.tokens_out || 0);
      break;
    }
    case "limits":   // the provider's rate limits after a reply (only providers that report them)
      S.limits = { t: ev.t || 0, model: ev.model || "", rows: Array.isArray(ev.rows) ? ev.rows : [] };
      break;
    case "compact":
      S.compactions.push({ t: ev.t || 0, description: ev.description || "", emergency: !!ev.emergency });
      log(ev, "k-sub", `${ev.emergency ? "emergency " : ""}compaction · ${ev.description || ""}`);
      S.caption = "Context compacted: " + (ev.description || "");
      break;
    case "lessons":
      S.lessons = ev.items || []; S.lessonsSeen = true;
      log(ev, "k-sub", `recalled ${S.lessons.length} lesson${S.lessons.length === 1 ? "" : "s"}`);
      fx && fx.hot("lessons>context", C.violet);
      break;
    case "subagent_start": {
      S.subCount[agent] = (S.subCount[agent] || 0) + 1;
      const rk = agent + "#" + S.subCount[agent];
      S.subRuns.set(rk, { key: rk, agent, n: S.subCount[agent], start: ev.t || 0, active: true, prompt: String(ev.prompt || ""),
        status: "", end: null, steps: [], report: "", toolCalls: 0 });
      S.subCur[agent] = rk;
      S.subagents.set(agent, { start: ev.t || 0, active: true });
      S.agentUse.set(agent, (S.agentUse.get(agent) || 0) + 1);
      log(ev, "k-sub", `sub-agent ${agent} started · ${oneLine(ev.prompt).slice(0, 200)}`);
      if (fx) { fx.hot(`model>sub:${rk}`, C.violet); fx.chip("model", "sub:" + rk, { label: agent, color: C.violet }); }
      break;
    }
    case "subagent_end": {
      const run = subRun(agent), s = S.subagents.get(agent);
      endLlm(agent, ev.t, false);
      if (run) Object.assign(run, { active: false, status: ev.status || "", end: ev.t, toolCalls: ev.tool_calls || 0 });
      if (s) { s.active = false; pushSpan({ lane: 2, agent, start: s.start, end: ev.t, label: agent, ok: ev.status === "ok" }); }
      log(ev, ev.status === "ok" ? "k-sub" : "k-err", `sub-agent ${agent} ${ev.status} · ${fmtDur(ev.duration || 0)} · ${ev.tool_calls || 0} tool calls`);
      if (run && fx) fx.hot(`sub:${run.key}>model`, ev.status === "ok" ? C.green : C.rose);
      break;
    }
    case "todos":
      S.todos = ev.items || [];
      break;
    case "hook":
      S.hookRuns++;
      S.hookLog.push({ t: ev.t || 0, event: ev.event || "", tool: ev.tool || "", command: ev.command || "", outcome: ev.outcome || "", duration: ev.duration || 0 });
      if (S.hookLog.length > 200) S.hookLog.splice(0, S.hookLog.length - 200);
      log(ev, ev.outcome === "blocked" ? "k-err" : "k-hook",
        `hook ${ev.event}${ev.tool ? " (" + ev.tool + ")" : ""} · ${ev.outcome} · ${fmtDur(ev.duration || 0)} · ${ev.command || ""}`);
      if (ev.outcome === "blocked") S.caption = `A ${ev.event} hook blocked this step`;
      fx && fx.hot("hooks>context", ev.outcome === "blocked" ? C.rose : C.orange);
      break;
  }
}

// ------------------------------------------------------------------ what each panel shows (HTML from real state only)

const DOT = { requested: "d-wait", asking: "d-ask", approved: "d-ask", denied: "d-fail", running: "d-run" };
function toolDot(t) { return t.state === "done" ? (t.ok ? "d-ok" : "d-fail") : DOT[t.state] || "d-idle"; }
function toolState(t) {
  switch (t.state) {
    case "requested": return "requested";
    case "asking": return "awaiting approval";
    case "approved": return "approved";
    case "denied": return "denied";
    case "running": return "running";
    default:

    const t = el.querySelector('[data-g="t"]'); if (t.textContent !== txt) t.textContent = txt;
    const bar = el.querySelector('[data-g="b"]'), col = frac >= 1 ? C.rose : frac >= .8 ? C.amber : C.teal;
    const wd = (frac * 100).toFixed(1) + "%";
    if (bar.style.width !== wd) bar.style.width = wd;
    if (bar.dataset.col !== col) { bar.style.background = col; bar.dataset.col = col; }
  });
}
function llmNow() {   // the model call that matters most right now: streaming > sent > preparing, newest first
  const rank = { streaming: 3, sent: 2, preparing: 1 };
  let best = null;
  S.llm.forEach((c) => { if (!best || rank[c.state] > rank[best.state] || (rank[c.state] === rank[best.state] && c.start > best.start)) best = c; });
  return best;
}
function callText() {   // the current model call's own clock: waiting vs streaming
  const c = llmNow();
  if (!c) { const l = S.lastCall.get("main"); return l && l.end != null ? `last call ${fmtDur(l.end - l.start)}` : "no model call"; }
  const now = clock(), who = c.agent === "main" ? "" : c.agent + ": ";
  if (c.state === "preparing") return `${who}preparing ${fmtDur(now - c.start)}`;
  if (c.state === "sent") return `${who}waiting ${fmtDur(now - c.sentAt)}`;
  return `${who}waited ${fmtDur((c.firstAt ?? now) - (c.sentAt ?? c.start))} · streaming ${fmtDur(now - c.firstAt)}`;
}
function drawUsageRoot(root) {
  const big = root.classList.contains("big"), s = tpsSeries();
  setText(root, "tps", s.cur ? "~" + Math.round(s.cur) : "0");
  setText(root, "peak", "~" + Math.round(s.peak));
  setText(root, "call", callText());
  const last = S.reqs[S.reqs.length - 1];
  setText(root, "last", last ? `${fmtNum(last.in)} in · ${fmtNum(last.out)} out` : "–");
  setText(root, "nreq", `${S.reqs.length} request${S.reqs.length === 1 ? "" : "s"}`);
  const pct = S.ctx.usable ? 100 * S.ctx.used / S.ctx.usable : 0;
  setText(root, "ctx", pct.toFixed(pct < 10 ? 1 : 0) + "%");
  const est = ctxEstimate();
  setText(root, "est", est ? `Estimate: at this rate the context fills in ~${fmtNum(est.n)} more request${est.n === 1 ? "" : "s"} (+${fmtNum(Math.round(est.avg))} tokens each, ${fmtNum(est.left)} left)`
    : "Estimate: needs a few more requests");
  for (const cv of root.querySelectorAll("canvas[data-c]")) {
    if (cv.dataset.c === "tps") drawTps(cv); else if (cv.dataset.c === "reqs") drawReqs(cv, big); else drawCtx(cv);
  }
  drawLimits(root);
  drawCost(root);
}
let usageIdleAt = 0;
function usageActive() {
  return S.llm.size > 0 || (mode === "replay" && playing) || tpsSeries().cur > 0 || [...S.tools.values()].some((t) => t.state === "running");
}
function drawUsage(now) {   // every frame while something moves; once a second otherwise (countdowns)
  if (!usageActive() && now - usageIdleAt < 1000) return;
  usageIdleAt = now;
  for (const root of document.querySelectorAll("[data-usage]")) if (root.offsetParent) drawUsageRoot(root);
  const k = usageKeys();
  if (k !== lastKeys) { $("fkeys").innerHTML = k; lastKeys = k; }
}
function usageKeys() {   // one line of key numbers for the collapsed strip
  const parts = [], cur = tpsNow();
  parts.push(`<span><b>${cur ? "~" + Math.round(cur) : "0"}</b> tok/s</span>`);
  const last = S.reqs[S.reqs.length - 1];
  if (last) parts.push(`<span>last <b>${fmtNum(last.in)}</b>→<b>${fmtNum(last.out)}</b></span>`);
  if (S.ctx.usable) parts.push(`<span>ctx <b>${Math.round(100 * S.ctx.used / S.ctx.usable)}%</b></span>`);
  if (S.cost.priced || S.cost.unpriced) parts.push(`<span>cost <b>${esc(costText())}</b></span>`);
  const lr = limitRows()[0];
  if (lr) parts.push(`<span>${esc(lr.name)} <b>${Number.isFinite(lr.rem) ? fmtInt(lr.rem) : "?"}</b>${lr.left != null && lr.left > 0 ? " · " + fmtLeft(lr.left) : ""}</span>`);
  else if (S.reqs.length) parts.push('<span class="c-faint">no provider limits</span>');
  return parts.join("");
}

// the compact strip at the bottom: a one-lane mini timeline + key numbers; click to expand
let footOpen = storeGet("footer:open") === "1", lastKeys = "";
function setFoot(open) {
  footOpen = open; storeSet("footer:open", open ? "1" : null);
  $("fbody").hidden = !open; $("fchev").textContent = open ? "▾" : "▸";
  $("fbar").setAttribute("aria-expanded", open ? "true" : "false");
  if (open && !$("charts").firstChild) $("charts").innerHTML = usageSkeleton("footer", false);
  usageIdleAt = 0;
}
$("fbar").addEventListener("click", () => setFoot(!footOpen));
$("fbar").addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); setFoot(!footOpen); } });
const mini = $("mini"), mctx = mini.getContext("2d");
function drawMini() {
  const r = mini.getBoundingClientRect(), w = r.width, h = r.height;
  if (!w) return;
  if (mini.width !== Math.round(w * DPR) || mini.height !== Math.round(h * DPR)) { mini.width = Math.round(w * DPR); mini.height = Math.round(h * DPR); }
  mctx.setTransform(DPR, 0, 0, DPR, 0, 0); mctx.clearRect(0, 0, w, h);
  const now = clock(), span = Math.max(30, Math.min(now, 120)), t0 = Math.max(0, now - span), x = (t) => (t - t0) / span * w;
  mctx.fillStyle = "rgba(94,234,212,.06)"; mctx.fillRect(0, 0, w, h);
  const bar = (s, e, y, hh, col) => { if (e < t0 || s == null) return; const x1 = x(Math.max(s, t0)); mctx.fillStyle = col; mctx.fillRect(x1, y, Math.max(1.5, x(e) - x1), hh); };
  const half = Math.floor(h / 2);
  const model = (sp, end) => { bar(sp.start, sp.first ?? end, 0, half - 1, "rgba(103,232,249,.28)"); if (sp.first != null) bar(sp.first, end, 0, half - 1, sp.ok === false ? C.rose : C.cyan); };
  for (const sp of S.spans) {
    if (sp.lane === 0) model(sp, sp.end);
    else if (sp.lane === 1 && sp.start != null) bar(sp.start, sp.end, half, h - half, sp.ok === false ? C.rose : KIND_COLOR[sp.kind] || C.other);
  }
  S.llm.forEach((c) => model({ start: c.start, first: c.firstAt }, now));
  S.tools.forEach((t) => { if (t.state === "running") bar(t.startAt, now, half, h - half, KIND_COLOR[t.kind]); else if (t.state === "asking") bar(t.askAt, now, half, h - half, C.amber); });
}

// copy what the drawer shows, as plain text
async function copyText(text, btn) {
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; }
  catch { ok = false; }
  if (!ok) {   // no clipboard permission: select it so Ctrl+C works
    const target = btn && btn.closest("pre") ? btn.closest("pre") : $("dbody");
    const range = document.createRange(); range.selectNodeContents(target);
    const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
  }
  if (btn) {
    const old = btn.dataset.label || btn.textContent;
    btn.dataset.label = old;
    btn.classList.add("done"); btn.textContent = ok ? "Copied" : "Selected";
    setTimeout(() => { btn.classList.remove("done"); btn.textContent = old; }, 1500);
  }
}
function preText(pre) { const c = pre.cloneNode(true); c.querySelectorAll(".cpy").forEach((b) => b.remove()); return c.innerText; }
function addPreCopy(root) {
  for (const pre of root.querySelectorAll("pre")) {
    if (pre.querySelector(".cpy")) continue;
    const b = document.createElement("button");
    b.className = "cpy"; b.type = "button"; b.title = "Copy this block"; b.setAttribute("aria-label", "Copy this block"); b.textContent = "⧉";
    pre.prepend(b);
  }
}
$("dcopy").addEventListener("click", (e) => {
  e.stopPropagation();
  const body = $("dbody").cloneNode(true);
  body.querySelectorAll(".cpy, .filters").forEach((b) => b.remove());
  copyText($("dtitle").textContent + "\n\n" + body.innerText, $("dcopy"));
});
$("dbody").addEventListener("click", (e) => {
  const b = e.target.closest(".cpy");
  if (!b) return;
  e.stopPropagation(); e.preventDefault();
  copyText(preText(b.closest("pre")), b);
}, true);

// ------------------------------------------------------------------ timeline

const tl = $("timeline"), tctx = tl.getContext("2d");
let hatch = null, DPR = window.devicePixelRatio || 1;
function hatchPattern() {
  if (hatch) return hatch;
  const p = document.createElement("canvas"); p.width = 8; p.height = 8;
  const pc = p.getContext("2d"); pc.fillStyle = "rgba(251,191,36,.18)"; pc.fillRect(0, 0, 8, 8);
  pc.strokeStyle = C.amber; pc.lineWidth = 2; pc.beginPath(); pc.moveTo(-2, 10); pc.lineTo(10, -2); pc.moveTo(6, 10); pc.lineTo(10, 6);
  pc.moveTo(-2, 2); pc.lineTo(2, -2); pc.stroke();
  hatch = tctx.createPattern(p, "repeat");
  return hatch;
}
function drawTimeline() {
  if (!tl.offsetParent) return;   // collapsed
  const r = tl.getBoundingClientRect(); const w = r.width, h = r.height;
  DPR = window.devicePixelRatio || 1;
  if (tl.width !== Math.round(w * DPR) || tl.height !== Math.round(h * DPR)) { tl.width = Math.round(w * DPR); tl.height = Math.round(h * DPR); }
  tctx.setTransform(DPR, 0, 0, DPR, 0, 0); tctx.clearRect(0, 0, w, h);
  const now = clock(); const span = Math.max(30, Math.min(now, 120)); const t0 = Math.max(0, now - span);
  const left = w < 480 ? 62 : 78, x = (t) => left + (t - t0) / span * (w - left - 8);
  const lanes = [{ name: "model", y: 4, h: 24 }, { name: "tools", y: 32, h: 44 }, { name: "sub-agents", y: 80, h: 18 }];
  tctx.font = `11px ${MONO}`; tctx.textBaseline = "middle";
  lanes.forEach((l) => { tctx.fillStyle = C.dim; tctx.textAlign = "left"; tctx.fillText(l.name, 0, l.y + l.h / 2);
    tctx.fillStyle = "rgba(94,234,212,.05)"; tctx.fillRect(left, l.y, w - left - 8, l.h); });
  const box = (s, e, y, hh, fill, minW) => {
    if (e < t0 || s == null) return null;
    const x1 = x(Math.max(s, t0)), x2 = Math.max(x1 + (minW || 2), x(e));
    tctx.fillStyle = fill; tctx.fillRect(x1, y, x2 - x1, hh); return [x1, x2];
  };
  const label = (xs, y, hh, text) => {
    if (!xs || xs[1] - xs[0] < 40 || !text) return;
    tctx.save(); tctx.beginPath(); tctx.rect(xs[0], y, xs[1] - xs[0], hh); tctx.clip();
    tctx.fillStyle = "#06201e"; tctx.textAlign = "left"; tctx.font = `10.5px ${MONO}`; tctx.fillText(text, xs[0] + 4, y + hh / 2 + .5);
    tctx.restore();
  };
  const model = (sp, end) => {   // preparing / waiting drawn light, streaming solid
    const L = lanes[0], y = L.y + 3, hh = L.h - 6, bad = sp.ok === false;
    const first = sp.first != null ? sp.first : end, sent = sp.sent != null ? sp.sent : first;
    box(sp.start, sent, y, hh, bad ? C.rose + "44" : "rgba(103,232,249,.12)");
    box(sent, first, y, hh, bad ? C.rose + "66" : "rgba(103,232,249,.3)");
    if (sp.first != null) box(sp.first, end, y, hh, bad ? C.rose : C.cyan + "dd");
    if (bad) box(sp.start, end, y, 2, C.rose);
  };
  for (const sp of S.spans) if (sp.lane === 0) model(sp, sp.end);
  S.llm.forEach((c) => model({ start: c.start, sent: c.sentAt, first: c.firstAt, ok: true }, now));
  const tools = S.spans.filter((sp) => sp.lane === 1 && sp.end >= t0);
  S.tools.forEach((t) => { if (t.state === "running" || t.askAt != null) tools.push({ lane: 1, agent: t.agent, kind: t.kind, label: toolLabel(t),
    ask: t.askAt, askEnd: t.askAt != null ? (t.askEnd ?? now) : null, start: t.startAt, end: now, ok: null, live: true }); });
  tools.sort((a, b) => (a.ask ?? a.start ?? a.end) - (b.ask ?? b.start ?? b.end));
  const L = lanes[1], rowsN = 3, rh = (L.h - 4) / rowsN, rowEnd = new Array(rowsN).fill(-1e9);
  for (const sp of tools) {   // greedy rows so parallel calls do not hide each other
    const s = sp.ask ?? sp.start ?? sp.end, x1 = x(Math.max(s, t0)), x2 = Math.max(x1 + 2, x(sp.end));
    let row = rowEnd.findIndex((e) => e <= x1);
    if (row < 0) row = rowEnd.indexOf(Math.min(...rowEnd));
    rowEnd[row] = x2 + 1;
    const y = L.y + 2 + row * rh, hh = rh - 2;
    if (sp.ask != null) box(sp.ask, sp.askEnd ?? sp.end, y, hh, hatchPattern());
    const col = KIND_COLOR[sp.kind] || C.other;
    if (sp.start != null) {
      const xs = box(sp.start, sp.end, y, hh, sp.ok === false ? C.rose : col + (sp.live ? "ff" : "cc"));
      label(xs, y, hh, sp.agent !== "main" ? sp.agent + ": " + sp.label : sp.label);
    } else if (sp.ok === false) box(sp.end, sp.end, y, hh, C.rose, 3);   // never ran (denied / rejected)
    if (sp.agent !== "main" && sp.start != null) box(sp.start, sp.end, y, 1.5, C.violet);
  }
  const SL = lanes[2];
  for (const sp of S.spans) if (sp.lane === 2) label(box(sp.start, sp.end, SL.y + 2, SL.h - 4, sp.ok ? C.violet + "cc" : C.rose), SL.y + 2, SL.h - 4, sp.label);
  S.subagents.forEach((s, n) => { if (s.active) label(box(s.start, now, SL.y + 2, SL.h - 4, C.violet), SL.y + 2, SL.h - 4, n); });
  tctx.fillStyle = C.faint; tctx.textAlign = "right"; tctx.font = `11px ${MONO}`; tctx.fillText(fmtTime(now), w - 8, h - 6);
  tctx.textAlign = "left"; tctx.fillText(fmtTime(t0), left, h - 6);
}

// ------------------------------------------------------------------ live + replay

const params = new URLSearchParams(location.search);
const token = params.get("t") || "";
let following = "", mode = "live", recorded = [], adjusted = [], replayPos = 0, replayClock = 0, playing = true, liveBase = null;

function clock() {
  if (mode === "replay") return replayClock;
  if (!liveBase) return S.now;
  return liveBase.t + (performance.now() - liveBase.at) / 1000;
}
let lastTimers = 0, lastFrame = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - lastFrame) / 1000); lastFrame = now;
  if (mode === "replay" && playing && adjusted.length) {
    replayClock += dt * speed();
    while (replayPos < adjusted.length && adjusted[replayPos].t <= replayClock) apply(adjusted[replayPos++], fx);
    const end = adjusted[adjusted.length - 1].t;
    if (replayPos >= adjusted.length && replayClock >= end + 1.5) { playing = false; $("play").textContent = "▶"; }
    $("seek").value = String(Math.round(1000 * clamp(replayClock / Math.max(end, .001), 0, 1)));
    $("clock").textContent = `${fmtTime(Math.min(replayClock, end))} / ${fmtTime(end)}`;
  }
  renderPanels(false);
  if (!fitted && layoutPos.size && viewport.clientWidth) { fitted = true; fitAll(.6); }
  if (!flat()) { drawWires(now); drawChips(now); followStep(dt); }
  if (now - lastTimers > 200) { lastTimers = now; updateTimers(world); }
  drawTimeline(); drawMini(); drawUsage(now);
  requestAnimationFrame(frame);
}

function compressGaps(events) {
  let shift = 0, prev = null;
  return events.map((ev) => {
    const t = ev.t || 0;
    if (prev !== null && t - prev > MAX_GAP) shift += t - prev - MAX_GAP;
    prev = t;
    return { ...ev, t: Math.max(0, t - shift) };
  });
}

function resetScene() { S = freshState(); hot.clear(); clearChips(); lastVer = -1; }

function seekTo(target) {
  if (adjusted.length) target = clamp(target, 0, adjusted[adjusted.length - 1].t);   // never past the end
  resetScene();
  replayPos = 0; replayClock = target;
  while (replayPos < adjusted.length && adjusted[replayPos].t <= target) apply(adjusted[replayPos++], null);
  renderPanels(true);
  if (adjusted.length) {
    const end = adjusted[adjusted.length - 1].t;
    $("clock").textContent = `${fmtTime(target)} / ${fmtTime(end)}`;
    $("seek").value = String(Math.round(1000 * clamp(target / Math.max(end, .001), 0, 1)));
  }
}

function setStatus(text, cls) { const s = $("status"); s.textContent = text; s.className = "badge " + (cls || ""); }

function connect() {
  const es = new EventSource("events?t=" + encodeURIComponent(token));
  let catching = true;
  es.addEventListener("hello", (m) => {
    const info = JSON.parse(m.data); mode = info.mode; following = info.following || "";
    const rec = $("rec"), dl = $("download"), path = String(info.recording || "");
    dl.href = "recording?t=" + encodeURIComponent(token); dl.hidden = false;
    if (mode === "live" && path) { rec.hidden = false; rec.className = "badge rec"; rec.textContent = "REC"; rec.title = "Recording to " + path; }
    else if (mode === "replay" && path) { rec.hidden = false; rec.className = "badge"; rec.textContent = "Recording · " + baseName(path); rec.title = path; }
    else rec.hidden = true;
    if (mode === "replay") { setStatus("replay", ""); $("controls").classList.add("on"); recorded = []; applySpeed(); }
    else {
      setStatus("live", "live"); resetScene(); catching = true;
      if (following) S.caption = "Waiting for MUYAH-CODE in " + following + " …";
    }
    if (info.title) document.title = "MUYAH-CODE · " + info.title;
  });
  es.onmessage = (m) => {
    const ev = JSON.parse(m.data);
    if (mode === "replay") { recorded.push(ev); return; }
    if (ev.type === "reset") {   // a newer session started in the followed folder
      resetScene(); liveBase = null;
      S.caption = "New session " + (ev.session_id || "") + " started";
      renderPanels(true);
      return;
    }
    liveBase = { t: ev.t || 0, at: performance.now() };
    apply(ev, catching ? null : fx);
  };
  es.addEventListener("caughtup", () => { catching = false; renderPanels(true); });
  es.addEventListener("end", () => {
    es.close();
    adjusted = compressGaps(recorded);
    if (!adjusted.length) { S.caption = "This session has no recorded events."; renderPanels(true); return; }
    seekTo(0); playing = true; $("play").textContent = "❚❚";
  });
  // The browser retries a dropped stream on its own (a restarted session reconnects). After a few failed
  // tries the session is gone: stop retrying instead of filling the console, and say so.
  let failures = 0;
  es.onerror = () => {
    if (mode !== "live") return;
    failures += 1;
    setStatus("disconnected", "off");
    if (failures >= 5) {
      es.close();
      S.caption = "The session ended (or the viewer stopped). Reload this page to reconnect.";
      renderPanels(true);
    }
  };
  es.onopen = () => { failures = 0; if (mode === "live") setStatus("live", "live"); };
}

$("play").onclick = () => {
  if (!adjusted.length) return;
  if (!playing && replayPos >= adjusted.length) seekTo(0);
  playing = !playing; $("play").textContent = playing ? "❚❚" : "▶";
};
$("restart").onclick = () => { if (adjusted.length) { seekTo(0); playing = true; $("play").textContent = "❚❚"; } };
$("seek").oninput = (e) => {
  if (!adjusted.length) return;
  seekTo(adjusted[adjusted.length - 1].t * Number(e.target.value) / 1000);
};
document.addEventListener("keydown", (e) => {
  const tag = e.target.tagName;
  if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
  if (e.key === "Escape" && drawerKey) { closeDrawer(); return; }
  if (e.code === "Space" && mode === "replay" && tag !== "BUTTON" && tag !== "SUMMARY") { e.preventDefault(); $("play").click(); return; }
  if (flat()) return;
  if (e.key === "f" || e.key === "F") { setFollow(false); fitAll(); }
  else if (e.key === "0") zoomAt(viewport.clientWidth / 2, viewport.clientHeight / 2, 1);
});
function speed() { return clamp(Number($("speed").value) || 1, .1, 16); }
// how much slower (>1) or faster (<1) animations run: they follow the replay speed, so 0.1x is ten times calmer
function slow() { return mode === "replay" ? clamp(1 / speed(), .25, 10) : 1; }
function applySpeed() { document.documentElement.style.setProperty("--k", String(slow())); }
$("speed").addEventListener("change", applySpeed);
if (params.get("speed")) {
  const v = clamp(Number(params.get("speed")) || 1, .1, 16);
  if (![...$("speed").options].some((o) => Number(o.value) === v)) {
    const o = document.createElement("option"); o.value = String(v); o.textContent = v + "×";
    const after = [...$("speed").options].find((x) => Number(x.value) > v);
    $("speed").insertBefore(o, after || null);
  }
  $("speed").value = [...$("speed").options].find((o) => Number(o.value) === v).value;
}

window.addEventListener("resize", () => { wiresDirty = true; applyCam(); });
setFoot(footOpen); applyCam(); renderPanels(true); connect(); requestAnimationFrame(frame);
</script>
